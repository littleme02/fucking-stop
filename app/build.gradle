plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.natmon.fuckingstop'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.natmon.fuckingstop'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2'
    }

    // Release key lives outside the repo; without it, release builds use the debug key.
    def keyProps = file(System.getenv('FUCKING_STOP_KEYSTORE') ?: "${System.getProperty('user.home')}/.config/fucking-stop/keystore.properties")
    signingConfigs {
        release {
            if (keyProps.exists()) {
                def p = new Properties()
                keyProps.withInputStream { p.load(it) }
                storeFile file(p.storeFile)
                storePassword p.storePassword
                keyAlias p.keyAlias
                keyPassword p.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyProps.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
