plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.natmon.fuckingstop'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.natmon.fuckingstop'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
